<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Florida Big Bass Finder</title>

<link
rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>

<style>

* {
box-sizing:border-box;
}

body {
margin:0;
font-family:Arial,Helvetica,sans-serif;
background:#07141b;
color:#fff;
}

header {
background:#0c2937;
padding:18px 15px;
text-align:center;
border-bottom:2px solid #23677b;
}

header h1 {
margin:0;
font-size:26px;
}

header p {
margin:7px 0 0;
color:#b9d4dc;
}

.container {
max-width:1000px;
margin:auto;
padding:14px;
}

.card {
background:#102630;
border-radius:12px;
padding:16px;
margin-bottom:14px;
box-shadow:0 3px 12px rgba(0,0,0,.35);
}

.card h2 {
margin-top:0;
}

label {
display:block;
font-weight:bold;
margin-bottom:7px;
}

select {
width:100%;
padding:13px;
border:0;
border-radius:8px;
font-size:16px;
background:#fff;
color:#111;
}

.conditions {
display:grid;
grid-template-columns:repeat(2,1fr);
gap:10px;
}

.condition {
background:#081a23;
border-radius:9px;
padding:13px;
}

.condition span {
display:block;
font-size:13px;
color:#9dbcc6;
margin-bottom:5px;
}

.condition strong {
font-size:18px;
}

#map {
width:100%;
height:520px;
border-radius:10px;
overflow:hidden;
}

.mapButtons {
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px;
margin-bottom:10px;
}

.mapButton {
margin:0;
padding:11px 5px;
font-size:14px;
background:#197fa7;
}

.mapButton.active {
background:#0cce8b;
color:#061b14;
}

.status {
margin-top:10px;
padding:10px;
border-radius:7px;
background:#0a1c25;
color:#b9d4dc;
font-size:13px;
line-height:1.5;
}

.legend {
margin-top:10px;
padding:12px;
border-radius:8px;
background:#081a23;
font-size:14px;
line-height:1.9;
}

.legend span {
display:inline-block;
width:14px;
height:14px;
border-radius:50%;
margin-right:7px;
vertical-align:-2px;
border:1px solid white;
}

.blue {
background:#0066ff;
}

.green {
background:#00c853;
}

.yellow {
background:#ffd400;
}

.purple {
background:#a020f0;
}

.windLegend {
display:inline-block;
color:#ff9900;
font-weight:bold;
}

button {
width:100%;
padding:13px;
border:0;
border-radius:8px;
background:#197fa7;
color:white;
font-weight:bold;
font-size:16px;
margin-top:12px;
}

.windArrow {
color:#ff9900;
font-size:24px;
font-weight:bold;
text-shadow:
1px 1px 2px #000,
-1px -1px 2px #000,
1px -1px 2px #000,
-1px 1px 2px #000;
white-space:nowrap;
}

.depthLabel {
background:rgba(255,255,255,.85);
color:#003c88;
border:1px solid #003c88;
border-radius:3px;
padding:1px 3px;
font-size:11px;
font-weight:bold;
white-space:nowrap;
}

@media(max-width:650px) {

header h1 {
font-size:22px;
}

#map {
height:440px;
}

.mapButtons {
grid-template-columns:repeat(2,1fr);
}

}

</style>

</head>

<body>


<header>

<h1>🎣 Florida Big Bass Finder</h1>

<p>Find the water most likely to hold big bass</p>

</header>


<div class="container">


<div class="card">

<label for="lake">
Choose Lake or Chain
</label>

<select id="lake">

<option value="Lake Washington">
Lake Washington
</option>

<option value="Lake Poinsett">
Lake Poinsett
</option>

<option value="Harris Chain">
Harris Chain
</option>

<option value="Alligator Chain">
Alligator Chain
</option>

<option value="St. Johns River">
St. Johns River
</option>

<option value="Lake Kissimmee">
Lake Kissimmee
</option>

<option value="Blue Cypress Lake">
Blue Cypress Lake
</option>

<option value="Lake George">
Lake George
</option>

<option value="Lake Apopka">
Lake Apopka
</option>

</select>

</div>


<div class="card">

<h2 id="lakeName">
Lake Washington
</h2>

<div class="conditions">

<div class="condition">

<span>
Air Temperature
</span>

<strong id="airTemp">
Loading...
</strong>

</div>


<div class="condition">

<span>
Wind
</span>

<strong id="wind">
Loading...
</strong>

</div>


<div class="condition">

<span>
Barometric Pressure
</span>

<strong id="pressure">
Loading...
</strong>

</div>


<div class="condition">

<span>
Fishing Rating
</span>

<strong id="rating">
Loading...
</strong>

</div>

</div>


<button id="refreshWeather">
Refresh Current Conditions
</button>

</div>


<div class="card">

<h2>
🗺️ Fishing Map
</h2>


<div class="mapButtons">

<button
class="mapButton active"
id="satelliteButton">

🛰️ Satellite

</button>


<button
