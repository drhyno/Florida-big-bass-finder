<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Florida Big Bass Finder</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

body {
    margin:0;
    font-family:Arial,sans-serif;
    background:#07141b;
    color:white;
}

header {
    background:#0c2937;
    padding:18px;
    text-align:center;
}

header h1 {
    margin:0;
}

header p {
    color:#b9d4dc;
}

.container {
    max-width:1000px;
    margin:auto;
    padding:15px;
}

.card {
    background:#102630;
    padding:16px;
    margin-bottom:15px;
    border-radius:12px;
}

select {
    width:100%;
    padding:13px;
    font-size:16px;
    border-radius:8px;
}

.conditions {
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.condition {
    background:#081a23;
    padding:13px;
    border-radius:8px;
}

.condition span {
    display:block;
    color:#9dbcc6;
    font-size:13px;
}

.condition strong {
    font-size:18px;
}

#map {
    width:100%;
    height:450px;
    background:#ccc;
    border-radius:10px;
}

button {
    width:100%;
    padding:13px;
    margin-top:12px;
    border:0;
    border-radius:8px;
    background:#197fa7;
    color:white;
    font-size:16px;
    font-weight:bold;
}

</style>
</head>

<body>

<header>

<h1>🎣 Florida Big Bass Finder</h1>

<p>Find the water most likely to hold big bass</p>

</header>

<div class="container">

<div class="card">

<label>Choose Lake or Chain</label>

<select id="lake">

<option value="28.14405,-80.74552">
Lake Washington
</option>

<option value="28.33802,-80.83309">
Lake Poinsett
</option>

<option value="28.7800,-81.8000">
Harris Chain
</option>

<option value="28.1600,-81.6000">
Alligator Chain
</option>

<option value="28.7000,-81.5000">
St. Johns River
</option>

<option value="27.91069,-81.26696">
Lake Kissimmee
</option>

<option value="27.7267,-80.7748">
Blue Cypress Lake
</option>

<option value="29.2857,-81.5960">
Lake George
</option>

<option value="28.6240,-81.6261">
Lake Apopka
</option>

</select>

</div>

<div class="card">

<h2 id="lakeName">
Lake Washington
</h2>

<div class="conditions">

<div class="condition">
<span>Air Temperature</span>
<strong id="airTemp">Loading...</strong>
</div>

<div class="condition">
<span>Wind</span>
<strong id="wind">Loading...</strong>
</div>

<div class="condition">
<span>Barometric Pressure</span>
<strong id="pressure">Loading...</strong>
</div>

<div class="condition">
<span>Fishing Rating</span>
<strong id="rating">Loading...</strong>
</div>

</div>

<button onclick="loadWeather()">
Refresh Current Conditions
</button>

</div>

<div class="card">

<h2>🗺️ Lake Map</h2>

<div id="map"></div>

</div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>

/* MAP */

const map = L.map("map").setView(
    [28.14405,-80.74552],
    13
);

L.tileLayer(
    "https://tile.openstreetmap.org/{z}/{x}/{y}.png",
    {
        maxZoom:19,
        attribution:"© OpenStreetMap contributors"
    }
).addTo(map);


/* LAKE CHANGE */

document.getElementById("lake")
.addEventListener("change",function(){

    const parts =
        this.value.split(",");

    const lat =
        Number(parts[0]);

    const lon =
        Number(parts[1]);

    const name =
        this.options[
            this.selectedIndex
        ].text;

    document.getElementById("lakeName")
        .textContent = name;

    map.setView(
        [lat,lon],
        13
    );

    loadWeather();

});


/* WEATHER */

async function loadWeather(){

    const select =
        document.getElementById("lake");

    const parts =
        select.value.split(",");

    const lat =
        Number(parts[0]);

    const lon =
        Number(parts[1]);


    document.getElementById("airTemp")
        .textContent="Loading...";

    document.getElementById("wind")
        .textContent="Loading...";

    document.getElementById("pressure")
        .textContent="Loading...";

    document.getElementById("rating")
        .textContent="Loading...";


    const url =
        "https://api.open-meteo.com/v1/forecast" +

        "?latitude=" + lat +

        "&longitude=" + lon +

        "&current=" +
        "temperature_2m," +
        "surface_pressure," +
        "wind_speed_10m," +
        "wind_direction_10m" +

        "&temperature_unit=fahrenheit" +

        "&wind_speed_unit=mph" +

        "&timezone=auto";


    try {

        const response =
            await fetch(url);

        if(!response.ok){

            throw new Error(
                "Weather request failed"
            );

        }

        const data =
            await response.json();

        const current =
            data.current;


        const temp =
            Number(
                current.temperature_2m
            );

        const windSpeed =
            Number(
                current.wind_speed_10m
            );

        const windDirection =
            Number(
                current.wind_direction_10m
            );

        const pressure =
            Number(
                current.surface_pressure
            ) * 0.0295299833;


        const directions=[
            "N","NE","E","SE",
            "S","SW","W","NW"
        ];

        const compass =
            directions[
                Math.round(
                    windDirection / 45
                ) % 8
            ];


        document.getElementById("airTemp")
            .textContent =
            temp.toFixed(1)+"°F";


        document.getElementById("wind")
            .textContent =
            compass+" "+
            windSpeed.toFixed(1)+
            " MPH";


        document.getElementById("pressure")
            .textContent =
            pressure.toFixed(2)+
            " inHg";


        let rating="FAIR";


        if(
            pressure>=29.80 &&
            pressure<=30.20 &&
            windSpeed>=5 &&
            windSpeed<=15
        ){

            rating="EXCELLENT";

        }

        else if(
            windSpeed>=3 &&
            windSpeed<=18
        ){

            rating="GOOD";

        }


        document.getElementById("rating")
            .textContent=rating;

    }

    catch(error){

        console.error(error);

        document.getElementById("airTemp")
            .textContent="ERROR";

        document.getElementById("wind")
            .textContent="ERROR";

        document.getElementById("pressure")
            .textContent="ERROR";

        document.getElementById("rating")
            .textContent="ERROR";

    }

}


/* START */

loadWeather();

</script>

</body>
</html>
