<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Florida Big Bass Finder</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b1720;
  color: white;
}

header {
  background: #102c3a;
  padding: 18px;
  text-align: center;
  border-bottom: 2px solid #1f6175;
}

header h1 {
  margin: 0;
  font-size: 26px;
}

header p {
  margin: 7px 0 0;
  color: #b8d6df;
}

.container {
  max-width: 900px;
  margin: auto;
  padding: 15px;
}

.card {
  background: #142832;
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 15px;
  box-shadow: 0 3px 10px rgba(0,0,0,.35);
}

label {
  display: block;
  margin-bottom: 7px;
  font-weight: bold;
}

select {
  width: 100%;
  padding: 13px;
  border-radius: 8px;
  border: none;
  font-size: 16px;
}

.conditions {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.condition {
  background: #0d202a;
  padding: 14px;
  border-radius: 8px;
}

.condition span {
  display: block;
  color: #9fc2cc;
  font-size: 13px;
  margin-bottom: 5px;
}

.map {
  height: 420px;
  position: relative;
  overflow: hidden;
  border-radius: 12px;
  background:
    radial-gradient(circle at 25% 35%, #174f63 0 8%, transparent 9%),
    radial-gradient(circle at 70% 25%, #246b75 0 9%, transparent 10%),
    radial-gradient(circle at 50% 70%, #155064 0 14%, transparent 15%),
    radial-gradient(circle at 80% 75%, #246b75 0 7%, transparent 8%),
    #0a3a4b;
  border: 2px solid #2a7180;
}

.map-title {
  position: absolute;
  top: 12px;
  left: 12px;
  background: rgba(0,0,0,.65);
  padding: 8px 10px;
  border-radius: 7px;
  font-weight: bold;
}

.zone {
  position: absolute;
  border-radius: 50%;
  opacity: .85;
}

.blue {
  background: #168cff;
}

.green {
  background: #31c96b;
}

.yellow {
  background: #e5d62e;
}

.zone1 {
  width: 85px;
  height: 85px;
  left: 20%;
  top: 25%;
}

.zone2 {
  width: 110px;
  height: 110px;
  left: 55%;
  top: 18%;
}

.zone3 {
  width: 75px;
  height: 75px;
  left: 42%;
  top: 62%;
}

.zone4 {
  width: 95px;
  height: 95px;
  left: 72%;
  top: 62%;
}

.legend {
  display: flex;
  gap: 18px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 7px;
}

.dot {
  width: 16px;
  height: 16px;
  border-radius: 50%;
}

.blue-dot {
  background: #168cff;
}

.green-dot {
  background: #31c96b;
}

.yellow-dot {
  background: #e5d62e;
}

.note {
  color: #a9c3cc;
  font-size: 13px;
  line-height: 1.5;
}

button {
  width: 100%;
  padding: 14px;
  border: none;
  border-radius: 8px;
  background: #1d8fbd;
  color: white;
  font-size: 16px;
  font-weight: bold;
}

button:active {
  transform: scale(.99);
}
</style>
</head>

<body>

<header>
  <h1>🎣 Florida Big Bass Finder</h1>
  <p>Find the areas most likely to hold big bass</p>
</header>

<div class="container">

  <div class="card">
    <label for="lake">Choose a Lake or Chain</label>

    <select id="lake" onchange="changeLake()">
      <option>Lake Washington</option>
      <option>Lake Poinsett</option>
      <option>Harris Chain</option>
      <option>Alligator Chain</option>
      <option>St. Johns River</option>
      <option>Lake Kissimmee</option>
      <option>Blue Cypress Lake</option>
      <option>Lake George</option>
      <option>Lake Apopka</option>
    </select>
  </div>

  <div class="card">
    <h2 id="lakeName">Lake Washington</h2>

    <div class="conditions">

      <div class="condition">
        <span>Water Temperature</span>
        <strong id="waterTemp">82°F</strong>
      </div>

      <div class="condition">
        <span>Wind</span>
        <strong id="wind">SE 8 MPH</strong>
      </div>

      <div class="condition">
        <span>Barometer</span>
        <strong id="pressure">
