<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Florida Freshwater Smart Fishing Map | Salt Strong Style</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Leaflet Core CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <!-- Leaflet Heatmap Plugin -->
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #080d1a; color: #fff; overflow: hidden; }
    #map { width: 100%; height: 100%; position: absolute; z-index: 1; }

    /* Salt Strong Style Top Telemetry Bar */
    .top-telemetry-bar {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      height: 54px;
      background: rgba(10, 16, 30, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(56, 189, 248, 0.25);
      border-radius: 12px;
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .telemetry-item { display: flex; flex-direction: column; }
    .telemetry-label { font-size: 0.62rem; text-transform: uppercase; color: #64748b; font-weight: 800; letter-spacing: 0.5px; }
    .telemetry-val { font-size: 0.95rem; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 4px; }
    .val-highlight { color: #22c55e; }

    /* Floating Left Control Panel */
    .side-panel {
      position: absolute;
      top: 78px;
      left: 12px;
      width: 320px;
      max-width: calc(100vw - 24px);
      max-height: calc(100vh - 96px);
      background: rgba(10, 16, 30, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      padding: 16px;
      z-index: 1000;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }

    /* Search & Filter Component */
    .search-box { margin-bottom: 12px; }
    .search-box input {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      outline: none;
    }
    .search-box input:focus { border-color: #38bdf8; }

    .lake-select {
      width: 100%;
      background: #1e293b;
      border: 1px solid #334155;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.88rem;
      outline: none;
      margin-bottom: 14px;
      cursor: pointer;
    }

    /* Smart Bite Score Card */
    .score-card {
      background: linear-gradient(135deg, rgba(14, 165, 233, 0.15), rgba(3, 105, 161, 0.35));
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .score-big { font-size: 2.2rem; font-weight: 900; color: #38bdf8; line-height: 1; }
    .score-sub { font-size: 0.75rem; color: #4ade80; font-weight: 700; margin-top: 4px; text-transform: uppercase; }

    /* Salt Strong Slider */
    .slider-box { margin-bottom: 14px; }
    .slider-labels { display: flex; justify-content: space-between; font-size: 0.7rem; font-weight: 700; color: #94a3b8; margin-bottom: 6px; }
    input[type=range] { width: 100%; accent-color: #0ea5e9; cursor: pointer; }

    /* Map Layer Toggle Buttons */
    .layer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .layer-btn {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 8px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }
    .layer-btn.active { background: rgba(14, 165, 233, 0.25); border-color: #0ea5e9; color: #38bdf8; }
    .dot { width: 8px; height: 8px; border-radius: 50%; }

    /* Custom Map Marker Popup Style */
    .leaflet-popup-content-wrapper { background: #0f172a; color: #fff; border: 1px solid #38bdf8; border-radius: 10px; }
    .leaflet-popup-tip { background: #0f172a; }
    .popup-title { color: #38bdf8; font-weight: 800; font-size: 0.95rem; margin-bottom: 4px; }
    .popup-badge { background: #0284c7; color: #fff; font-size: 0.65rem; padding: 2px 6px; border-radius: 4px; font-weight: 800; }
    .popup-detail { font-size: 0.78rem; line-height: 1.35; margin-top: 6px; color: #cbd5e1; }
    .popup-lure { margin-top: 8px; padding-top: 6px; border-top: 1px solid #334155; font-size: 0.75rem; color: #f59e0b; font-weight: 700; }

    @media (max-width: 600px) {
      .top-telemetry-bar { font-size: 0.75rem; padding: 0 8px; }
      .telemetry-item:nth-child(3) { display: none; }
    }
  </style>
</head>
<body>

<!-- Salt Strong Dynamic Telemetry Header -->
<div class="top-telemetry-bar">
  <div class="telemetry-item">
    <span class="telemetry-label">Target Species</span>
    <span class="telemetry-val">FL Trophy Bass</span>
  </div>
  <div class="telemetry-item">
    <span class="telemetry-label">Solunar Bite Index</span>
    <span class="telemetry-val val-highlight" id="solunar-val">88% (PEAK)</span>
  </div>
  <div class="telemetry-item">
    <span class="telemetry-label">Wind / Drift Vector</span>
    <span class="telemetry-val" id="wind-val">12 mph East</span>
  </div>
  <div class="telemetry-item">
    <span class="telemetry-label">Barometer</span>
    <span class="telemetry-val">30.12 inHg ▲</span>
  </div>
</div>

<div id="map"></div>

<!-- Salt Strong Floating Control Engine -->
<div class="side-panel">
  <div class="search-box">
    <input type="text" id="search-input" placeholder="Search Florida Lake or Chain..." onkeyup="filterLakes()">
  </div>

  <select class="lake-select" id="lake-dropdown" onchange="selectLake(this.value)">
    <!-- Main Chains & Lakes populated dynamically -->
  </select>

  <div class="score-card">
    <div>
      <div style="font-size:0.65rem; text-transform:uppercase; letter-spacing:1px; color:#94a3b8; font-weight:700;">Smart Bite Rating</div>
      <div class="score-big" id="score-num">9.2</div>
      <div class="score-sub" id="score-status">Windward Feeding Active</div>
    </div>
    <div style="text-align:right;">
      <span style="background:#22c55e; color:#000; font-size:0.65rem; font-weight:900; padding:4px 8px; border-radius:6px;">90/10 RULE</span>
    </div>
  </div>

  <div class="slider-box">
    <div class="slider-labels">
      <span>Solunar Time Scrub</span>
      <span style="color:#f59e0b;" id="time-readout">07:00 AM</span>
    </div>
    <input type="range" id="time-slider" min="5" max="19" value="7" step="1" oninput="onTimeChange(this.value)">
  </div>

  <div class="layer-grid">
    <button class="layer-btn active" id="btn-heat" onclick="toggleLayer('heat')">
      <span class="dot" style="background:#ef4444;"></span> 90/10 Heatmap
    </button>
    <button class="layer-btn active" id="btn-grass" onclick="toggleLayer('grass')">
      <span class="dot" style="background:#22c55e;"></span> Hydrilla / Mats
    </button>
    <button class="layer-btn active" id="btn-contour" onclick="toggleLayer('contour')">
      <span class="dot" style="background:#38bdf8;"></span> Ledges / Channels
    </button>
    <button class="layer-btn active" id="btn-spots" onclick="toggleLayer('spots')">
      <span class="dot" style="background:#f59e0b;"></span> Smart Spots
    </button>
  </div>
</div>

<script>
  // Central GIS Data Matrix for Florida Freshwater Systems
  const floridaWaterbodies = {
    // 1. HARRIS CHAIN OF LAKES
    "harris_chain": {
      name: "Harris Chain - Lake Harris & Eustis",
      center: [28.800, -81.830],
      zoom: 12,
      spots: [
        { lat: 28.812, lng: -81.845, title: "Dead River Mouth Drop-off", rating: "9.5", lure: "Junebug Speed Worm / 1/2oz Jig", desc: "Current intersection connecting Harris and Eustis. High-volume bait movement." },
        { lat: 28.840, lng: -81.790, title: "Eustis North Shell Bar", rating: "9.1", lure: "Lipless Crankbait / Deep Diving Plug", desc: "Hard bottom shell hump adjacent to 14ft depth channel contour." }
      ],
      grass: [[28.815, -81.850], [28.825, -81.835], [28.810, -81.820]],
      contours: [[[28.845, -81.800], [28.835, -81.780], [28.820, -81.770]]],
      heatmap: [[28.812, -81.845, 1.0], [28.840, -81.790, 0.85], [28.820, -81.830, 0.7]]
    },

    // 2. ST. JOHNS RIVER SYSTEM (LAKE GEORGE & RODMAN)
    "lake_george": {
      name: "St. Johns River - Lake George",
      center: [29.230, -81.600],
      zoom: 11,
      spots: [
        { lat: 29.260, lng: -81.540, title: "Salt Springs Run Mouth", rating: "9.7", lure: "White ChatterBait / Live Shiner", desc: "Spring flow creates prime temperature threshold. Monster bass staging spot." },
        { lat: 29.180, lng: -81.630, title: "Drayton Island South Ledge", rating: "8.8", lure: "Carolina Rigged Brush Hog", desc: "Current-swept submerged timber and eelgrass points." }
      ],
      grass: [[29.265, -81.550], [29.250, -81.530], [29.230, -81.540]],
      contours: [[[29.200, -81.640], [29.170, -81.620]]],
      heatmap: [[29.260, -81.540, 1.0], [29.180, -81.630, 0.8]]
    },

    "rodman": {
      name: "St. Johns River - Rodman Reservoir",
      center: [29.500, -81.800],
      zoom: 12,
      spots: [
        { lat: 29.505, lng: -81.815, title: "Ocklawaha River Submerged Channel", rating: "9.8", lure: "Punching 1.5oz Flipping Weight", desc: "Deep timber channel edge. World-class trophy bass sanctuary." }
      ],
      grass: [[29.510, -81.820], [29.500, -81.800], [29.490, -81.815]],
      contours: [[[29.515, -81.830], [29.495, -81.790]]],
      heatmap: [[29.505, -81.815, 1.0]]
    },

    "lake_monroe": {
      name: "St. Johns River - Lake Monroe (Sanford)",
      center: [28.835, -81.240],
      zoom: 13,
      spots: [
        { lat: 28.845, lng: -81.260, title: "River Entry Bend (Sanford)", rating: "8.9", lure: "Squarebill Crankbait", desc: "River flow pushes shad directly against outer shell bar." }
      ],
      grass: [[28.840, -81.270], [28.850, -81.250], [28.835, -81.260]],
      contours: [[[28.845, -81.265], [28.825, -81.230]]],
      heatmap: [[28.845, -81.260, 0.9]]
    },

    // 3. KISSIMMEE CHAIN OF LAKES
    "lake_toho": {
      name: "Kissimmee Chain - Lake Tohopekaliga",
      center: [28.200, -81.350],
      zoom: 12,
      spots: [
        { lat: 28.205, lng: -81.355, title: "North Steer Beach Point", rating: "9.6", lure: "Black/Blue Soft Jerkbait", desc: "Windward Kissimmee grass line holding heavy shad schools." },
        { lat: 28.185, lng: -81.335, title: "Goblet Cove Ledge", rating: "9.0", lure: "Lipless Red Eye Shad", desc: "3ft to 8ft bathymetry slope. Ideal morning feeding shelf." }
      ],
      grass: [[28.208, -81.360], [28.202, -81.350], [28.195, -81.358]],
      contours: [[[28.210, -81.340], [28.190, -81.330]]],
      heatmap: [[28.205, -81.355, 1.0], [28.185, -81.335, 0.85]]
    },

    // 4. LAKE OKEECHOBEE & ISTOKPOGA
    "okeechobee": {
      name: "Lake Okeechobee (North & Shoal)",
      center: [27.150, -80.850],
      zoom: 11,
      spots: [
        { lat: 27.155, lng: -80.840, title: "Observation Shoal Edge", rating: "9.7", lure: "Hollow Body Frog / Swim Jig", desc: "Outer eelgrass and bulrush line. East wind pushes bait directly into mats." }
      ],
      grass: [[27.160, -80.860], [27.150, -80.830], [27.140, -80.850]],
      contours: [[[27.165, -80.850], [27.135, -80.835]]],
      heatmap: [[27.155, -80.840, 1.0]]
    },

    "istokpoga": {
      name: "Lake Istokpoga (Sebring)",
      center: [27.370, -81.300],
      zoom: 12,
      spots: [
        { lat: 27.375, lng: -81.320, title: "Big Island Spawning Flats", rating: "9.3", lure: "Weightless Watermelon Texas Rig", desc: "Submerged hydrilla fields with sandy pockets." }
      ],
      grass: [[27.380, -81.330], [27.370, -81.310], [27.360, -81.325]],
      contours: [[[27.385, -81.310], [27.355, -81.290]]],
      heatmap: [[27.375, -81.320, 0.95]]
    }
  };

  let map, heatLayer, grassGroup, contourGroup, spotGroup;
  let currentKey = 'harris_chain';

  // Initialize Leaflet Map with High-Resolution Satellite Base Layer
  map = L.map('map', { zoomControl: false }).setView(floridaWaterbodies.harris_chain.center, floridaWaterbodies.harris_chain.zoom);

  L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 18,
    attribution: 'Esri World Imagery'
  }).addTo(map);

  grassGroup = L.layerGroup().addTo(map);
  contourGroup = L.layerGroup().addTo(map);
  spotGroup = L.layerGroup().addTo(map);

  // Populate Lake Select Dropdown
  function initDropdown() {
    const dropdown = document.getElementById('lake-dropdown');
    dropdown.innerHTML = '';
    for (let key in floridaWaterbodies) {
      let opt = document.createElement('option');
      opt.value = key;
      opt.innerText = floridaWaterbodies[key].name;
      dropdown.appendChild(opt);
    }
  }

  function renderWaterbody(key) {
    const data = floridaWaterbodies[key];
    if (!data) return;

    grassGroup.clearLayers();
    contourGroup.clearLayers();
    spotGroup.clearLayers();
    if (heatLayer) map.removeLayer(heatLayer);

    // 1. Render Salt Strong 90/10 Heatmap Layer
    heatLayer = L.heatLayer(data.heatmap, { radius: 40, blur: 25, maxZoom: 15 }).addTo(map);

    // 2. Render Hydrilla/Vegetation Polygons
    if (data.grass && data.grass.length) {
      L.polygon(data.grass, { color: '#22c55e', fillColor: '#22c55e', fillOpacity: 0.35, weight: 2 }).addTo(grassGroup);
    }

    // 3. Render Bathymetry Depth Lines
    data.contours.forEach(line => {
      L.polyline(line, { color: '#38bdf8', weight: 3, dashArray: '4, 6' }).addTo(contourGroup);
    });

    // 4. Render Smart Spot Pins
    data.spots.forEach(spot => {
      const pinIcon = L.divIcon({
        className: 'custom-pin',
        html: `<div style="background:#ef4444; width:26px; height:26px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 12px rgba(239,68,68,0.9); display:flex; align-items:center; justify-content:center; font-weight:900; font-size:11px; color:#fff;">${spot.rating}</div>`,
        iconSize: [26, 26]
      });

      const popupHtml = `
        <div class="popup-title">${spot.title}</div>
        <span class="popup-badge">BITE SCORE: ${spot.rating}/10</span>
        <div class="popup-detail">${spot.desc}</div>
        <div class="popup-lure">RECOMMENDED LURE: ${spot.lure}</div>
      `;

      L.marker([spot.lat, spot.lng], { icon: pinIcon })
        .bindPopup(popupHtml)
        .addTo(spotGroup);
    });
  }

  function selectLake(key) {
    currentKey = key;
    const target = floridaWaterbodies[key];
    if (target) {
      map.flyTo(target.center, target.zoom, { duration: 1.5 });
      renderLakeData(key);
    }
  }

  function renderLakeData(key) {
    renderWaterbody(key);
  }

  function filterLakes() {
    const query = document.getElementById('search-input').value.toLowerCase();
    const dropdown = document.getElementById('lake-dropdown');
    
    for (let i = 0; i < dropdown.options.length; i++) {
      const opt = dropdown.options[i];
      const text = opt.text.toLowerCase();
      if (text.includes(query)) {
        opt.style.display = "";
      } else {
        opt.style.display = "none";
      }
    }
  }

  function toggleLayer(type) {
    const btn = document.getElementById(`btn-${type}`);
    btn.classList.toggle('active');

    if (type === 'heat') {
      if (map.hasLayer(heatLayer)) map.removeLayer(heatLayer);
      else map.addLayer(heatLayer);
    } else if (type === 'grass') {
      if (map.hasLayer(grassGroup)) map.removeLayer(grassGroup);
      else map.addLayer(grassGroup);
    } else if (type === 'contour') {
      if (map.hasLayer(contourGroup)) map.removeLayer(contourGroup);
      else map.addLayer(contourGroup);
    } else if (type === 'spots') {
      if (map.hasLayer(spotGroup)) map.removeLayer(spotGroup);
      else map.addLayer(spotGroup);
    }
  }

  function onTimeChange(val) {
    const formatted = val < 12 ? `${val}:00 AM` : val === 12 ? `12:00 PM` : `${val - 12}:00 PM`;
    document.getElementById('time-readout').innerText = formatted;

    // Dynamic bite algorithm simulation
    let score = (7.5 + Math.sin(val * 0.8) * 2.1).toFixed(1);
    score = Math.min(9.8, Math.max(5.4, score));

    document.getElementById('score-num').innerText = score;
    document.getElementById('solunar-val').innerText = `${Math.round(score * 10)}% (${score > 8.5 ? 'PEAK' : 'MODERATE'})`;
  }

  // Initialization Sequence
  initDropdown();
  renderWaterbody('harris_chain');
</script>
</body>
</html>
